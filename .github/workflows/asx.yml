name: ASX review

# Collects price-sensitive ASX announcements and what small-cap prices did afterwards.
# Runs after the close each weekday (about 5 pm Brisbane) and whenever the ASX scripts change.
# Results go to the asx-data branch. Separate from the crypto tracker: it never touches the data branch.
on:
  schedule:
    - cron: "7 7 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["asx/collect.mjs", "asx/stats.js", "asx/wallets.mjs", ".github/workflows/asx.yml"]

permissions:
  contents: write

concurrency:
  group: asx-review
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Get previous results
        run: |
          if git ls-remote --exit-code origin refs/heads/asx-data > /dev/null; then
            git clone -q --depth 1 -b asx-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" out
          else
            mkdir out && git -C out init -q -b asx-data && git -C out remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          fi
      - name: Collect and measure
        run: node asx/collect.mjs out
      - name: Mock wallets
        run: node asx/wallets.mjs out
      - name: Save results
        run: |
          cd out
          git config user.name "asx-review"
          git config user.email "asx-review@users.noreply.github.com"
          git add -A
          git commit -q --amend -m "ASX review data" 2>/dev/null || git commit -q -m "ASX review data"
          git push -q -f origin HEAD:asx-data
