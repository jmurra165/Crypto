name: Track signals

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collect.mjs", "watchlist.json", "config.json", ".github/workflows/track.yml"]

permissions:
  contents: write

concurrency:
  group: track-signals
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Score coins and update signals
        run: node collect.mjs
      - name: Save results
        run: |
          cd data
          git config user.name "meme-radar-tracker"
          git config user.email "meme-radar-tracker@users.noreply.github.com"
          git add -A
          git commit -q --amend -m "Tracker data" || true
          git push -f origin HEAD:data
