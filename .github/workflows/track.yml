name: Track signals

# GitHub's own scheduler proved unreliable for this repository, so each run keeps tracking for
# about 50 minutes, scoring about every 45 seconds, then starts the next run itself. The hourly
# schedule is only a safety net that restarts the chain if it ever stops.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collect.mjs", "strategy.mjs", "tune.mjs", "research.mjs", "watchlist.json", "config.json", ".github/workflows/track.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: track-signals
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Track for about 50 minutes
        run: |
          git -C data config user.name "meme-radar-tracker"
          git -C data config user.email "meme-radar-tracker@users.noreply.github.com"
          end=$(( $(date +%s) + 3000 ))
          while :; do
            start=$(date +%s)
            git pull -q --ff-only origin main || true
            node collect.mjs || echo "tracker run failed"
            node tune.mjs || echo "daily tuning failed"
            node research.mjs || echo "daily signal research failed"
            ( cd data && git add -A && { git commit -q --amend -m "Tracker data" || true; } && git push -q -f origin HEAD:data ) || echo "saving results failed"
            # Backup: three rolling daily copies, so one bad write cannot lose the record.
            slot=$(( 10#$(date -u +%j) % 3 ))
            if [ ! -f "/tmp/backup-$slot-$(date -u +%H)" ]; then
              git -C data push -q -f origin "HEAD:refs/heads/data-backup-$slot" && touch "/tmp/backup-$slot-$(date -u +%H)" || echo "backup failed"
            fi
            now=$(date +%s)
            if [ "$now" -ge "$end" ]; then break; fi
            wait=$(( 45 - (now - start) ))
            if [ "$wait" -lt 5 ]; then wait=5; fi
            sleep "$wait"
          done
      - name: Start the next run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run track.yml --ref main
